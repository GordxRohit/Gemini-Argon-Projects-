             *******************************************************************/
            const btnSound = document.getElementById('btn-sound');
            const iconSoundOff = document.getElementById('icon-sound-off');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const labelSound = document.getElementById('label-sound');

            const btnRain = document.getElementById('btn-rain');
            const btnWhirlpool = document.getElementById('btn-whirlpool');
            const btnCalm = document.getElementById('btn-calm');
            const btnClear = document.getElementById('btn-clear');
            const btnHideUI = document.getElementById('btn-hide-ui');
            const btnRestoreUI = document.getElementById('btn-restore-ui');
            const topUI = document.getElementById('top-ui');
            const bottomUI = document.getElementById('bottom-ui');
            const statusToast = document.getElementById('status-toast');
            const statusToastText = document.getElementById('status-toast-text');

            let rainActive = false;
            let toastTimeout = null;

            function showToast(msg) {
                statusToastText.textContent = msg;
                statusToast.style.opacity = '1';
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    statusToast.style.opacity = '0';
                }, 3200);
            }

            btnSound.addEventListener('click', () => {
                const isOn = audioEngine.toggleSound();
                btnSound.classList.toggle('active', isOn);
                iconSoundOff.classList.toggle('hidden', isOn);
                iconSoundOn.classList.toggle('hidden', !isOn);
                labelSound.textContent = isOn ? 'Sound On' : 'Sound Off';
                if (isOn) {
                    audioEngine.setRainActive(rainActive);
                    audioEngine.setWhirlpoolActive(whirlpool.active);
                }
            });

            btnRain.addEventListener('click', () => {
                rainActive = !rainActive;
                btnRain.classList.toggle('active', rainActive);
                audioEngine.setRainActive(rainActive);
                if (rainActive) showToast('Gentle rain shower started');
            });

            btnWhirlpool.addEventListener('click', () => {
                whirlpool.active = !whirlpool.active;
                btnWhirlpool.classList.toggle('active', whirlpool.active);
                audioEngine.setWhirlpoolActive(whirlpool.active);
                if (whirlpool.active) {
                    showToast('Whirlpool active — drag its center to move the current');
                }
            });

            btnCalm.addEventListener('click', () => {
                // Stop rain, stop whirlpool, and clear all ripples/droplets
                rainActive = false;
                whirlpool.active = false;
                whirlpool.strength = 0;
                btnRain.classList.remove('active');
                btnWhirlpool.classList.remove('active');
                audioEngine.setRainActive(false);
                audioEngine.setWhirlpoolActive(false);

                for (let i = 0; i < MAX_RIPPLES; i++) {
                    rippleUniformArray[i].set(0, 0, -100, 0);
                }
                splashManager.clearTransient();
                // Calm fish speeds down to peaceful cruise
                koiList.forEach(k => {
                    k.targetSpeed = 1.45;
                    k.speed = 1.45;
                });
                showToast('Water calmed to stillness');
            });

            btnClear.addEventListener('click', () => {
                while (koiList.length > 0) {
                    const k = koiList.pop();
                    k.dispose();
                }
                updateFishCountUI();
                showToast('Pond cleared — select or drag a Koi below to release');
            });

            // Hide / Restore UI for clean screen recording
            function setUIHidden(hidden) {
                topUI.classList.toggle('ui-hidden-top', hidden);
                bottomUI.classList.toggle('ui-hidden', hidden);
                if (hidden) {
                    btnRestoreUI.classList.remove('opacity-0', 'pointer-events-none');
                    btnRestoreUI.classList.add('opacity-60', 'pointer-events-auto');
                    showToast('Interface hidden for recording • Press Esc or Show UI to restore');
                } else {
                    btnRestoreUI.classList.add('opacity-0', 'pointer-events-none');
                    btnRestoreUI.classList.remove('opacity-60', 'pointer-events-auto');
                }
            }

            btnHideUI.addEventListener('click', () => setUIHidden(true));
            btnRestoreUI.addEventListener('click', () => setUIHidden(false));
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') setUIHidden(false);
            });

            // Pause Web Audio automatically when browser tab is hidden
            document.addEventListener('visibilitychange', () => {
                audioEngine.setTabHidden(document.hidden);
            });

            // Responsive Resize Handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                updatePondBounds();
            });

            /*******************************************************************
             * 10. MAIN ANIMATION LOOP
             *******************************************************************/
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const dt = Math.min(clock.getDelta(), 0.05);
                elapsedTime += dt;

                // Smoothly ramp whirlpool strength & update ring visual
                const targetWhirl = whirlpool.active ? 1.0 : 0.0;
                whirlpool.strength += (targetWhirl - whirlpool.strength) * 3.5 * dt;
                whirlpoolUniform.set(whirlpool.x, whirlpool.z, whirlpool.strength);

                whirlRingMesh.position.set(whirlpool.x, 0.03, whirlpool.z);
                whirlRingMesh.rotation.z -= 3.2 * dt;
                whirlRingMesh.scale.setScalar(0.85 + Math.sin(elapsedTime * 4.0) * 0.1);
                whirlRingMat.opacity = whirlpool.strength * 0.42;

                // Update all Koi fish
                for (let i = 0; i < koiList.length; i++) {
                    koiList[i].update(dt, koiList, pondBounds, whirlpool, handleKoiSurfaceSplash);
                }

                // Update 3D splash droplets, rings, and rain shower
                splashManager.update(dt, rainActive, pondBounds, addRipple);

                // Update shader time uniforms
                floorMat.uniforms.uTime.value = elapsedTime;
                waterMat.uniforms.uTime.value = elapsedTime;

                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
